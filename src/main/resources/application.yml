server:
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger_guard}
    username: ${DB_USERNAME:ledger_guard}
    password: ${DB_PASSWORD:ledger_guard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
app:
  webhook:
    secret: ${WEBHOOK_SECRET:test-secret-change-me}
