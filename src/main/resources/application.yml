server:
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger_guard}
    username: ${DB_USERNAME:ledger_guard}
    password: ${DB_PASSWORD:ledger_guard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    mapper:
      allow-coercion-of-scalars: false   # "1000" is not an acceptable amount
    parser:
      strict-duplicate-detection: true   # {"amountMinor":1,"amountMinor":2} is rejected
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
app:
  webhook:
    # No default on purpose: the app refuses to start without a secret of >= 16 characters.
    secret: ${WEBHOOK_SECRET:}
